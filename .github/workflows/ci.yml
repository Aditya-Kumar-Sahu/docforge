name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: cd backend && uv sync --group dev

      - name: Run Ruff
        run: cd backend && uv run ruff check .

      - name: Run Mypy
        run: cd backend && uv run mypy --strict app

      - name: Run Pytest with coverage (≥80% required)
        run: cd backend && uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Run ESLint
        run: cd frontend && pnpm run lint

      - name: Run TypeScript type check
        run: cd frontend && pnpm exec tsc --noEmit

      - name: Run Vitest
        run: cd frontend && pnpm run test

      - name: Build (validate compilation)
        run: cd frontend && pnpm run build
        env:
          # Required to prevent build failure on missing env vars
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_POSTHOG_KEY: placeholder
          NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
          NEXT_PUBLIC_SENTRY_DSN: ""

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: cd cli && uv sync --group dev

      - name: Run Ruff
        run: cd cli && uv run ruff check .

      - name: Run Mypy
        run: cd cli && uv run mypy --strict .
