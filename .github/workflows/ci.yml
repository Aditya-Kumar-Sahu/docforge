name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install dependencies
        run: cd backend && uv sync
      - name: Run Ruff
        run: cd backend && uv run ruff check .
      - name: Run Mypy
        run: cd backend && uv run mypy --strict app
      - name: Run Pytest
        run: cd backend && uv run pytest --cov=app

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: cd frontend && pnpm install
      - name: Run ESLint
        run: cd frontend && pnpm run lint
      - name: Run TSC
        run: cd frontend && pnpm exec tsc --noEmit

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install dependencies
        run: cd cli && uv sync
      - name: Run Ruff
        run: cd cli && uv run ruff check .
      - name: Run Mypy
        run: cd cli && uv run mypy --strict .
