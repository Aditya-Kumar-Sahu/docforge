[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "fastapi[standard]>=0.136.1",
    "pgvector>=0.4.2",
    "posthog>=3.11.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.12.1",
    "redis>=7.4.0",
    "sentry-sdk[fastapi]>=2.59.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "sse-starlette>=3.4.4",
    "structlog>=25.5.0",
    "supabase>=2.30.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "types-psycopg2>=2.9.21.20260724",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"

[tool.coverage.run]
omit = [
    "*/alembic/*",
    "*/tests/*",
    "app/models.py",          # shim re-exporter
    "app/core/celery_app.py", # infra config — no unit-testable logic
    "app/core/celery_tasks.py", # requires real Redis/Postgres/git — integration tested
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
