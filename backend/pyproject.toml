[project]
name = "docforge-backend"
version = "0.1.0"
dependencies = [
    "langchain>=1.2.18",
    "langchain-community>=0.4.1",
    "litellm>=1.83.14",
    "sse-starlette>=3.4.2",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["alembic/versions/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "PL"]
ignore = ["E501"] # Ignore line length generally, but we'll try to keep it clean

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
